[server]
maxUploadSize = 1000
maxMessageSize = 1000
enableXsrfProtection = true

[client]
# Pages are listed with friendly names by theme.sidebar_nav() instead.
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#12305a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f4f6"
textColor = "#0c1b33"
# The face itself is loaded by the stylesheet in theme.py / Auth.py.
font = "'Libre Franklin', 'Segoe UI', sans-serif"
