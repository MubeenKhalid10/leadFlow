[server]
maxUploadSize = 1000
maxMessageSize = 1000
enableXsrfProtection = true

[client]
# Pages are listed with friendly names by theme.sidebar_nav() instead.
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f7f8fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#161a2d"
